<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local USB Device Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #cce7ff; color: #004085; border: 1px solid #b3d7ff; }
        .device-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
        }
        .log {
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>USB Device Access Test</h2>
        <p>This test checks if the Web USB API is available and can access devices.</p>
        
        <div id="status-container"></div>
        
        <button id="check-support">Check USB API Support</button>
        <button id="request-device" disabled>Request USB Device</button>
        <button id="list-devices" disabled>List Connected Devices</button>
        <button id="clear-log">Clear Log</button>
        
        <div id="device-container"></div>
        
        <h3>Console Log:</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        let connectedDevices = [];
        
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${timestamp}] ${message}`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(message);
        }
        
        function showStatus(message, type) {
            const container = document.getElementById('status-container');
            container.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function updateDeviceList() {
            const container = document.getElementById('device-container');
            if (connectedDevices.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = '<h3>Connected Devices:</h3>';
            connectedDevices.forEach((device, index) => {
                const deviceDiv = document.createElement('div');
                deviceDiv.className = 'device-info';
                deviceDiv.innerHTML = `
                    <strong>Device ${index + 1}:</strong><br>
                    Product Name: ${device.productName || 'Unknown'}<br>
                    Manufacturer: ${device.manufacturerName || 'Unknown'}<br>
                    Vendor ID: ${device.vendorId || 'Unknown'}<br>
                    Product ID: ${device.productId || 'Unknown'}
                `;
                container.appendChild(deviceDiv);
            });
        }
        
        document.getElementById('check-support').addEventListener('click', async () => {
            log('Checking USB API support...');
            
            if (!navigator.usb) {
                log('❌ USB API is not supported in this browser', 'error');
                showStatus('USB API is not supported in this browser. Try Chrome/Edge with HTTPS.', 'error');
                return;
            }
            
            log('✅ USB API is supported');
            showStatus('USB API is supported!', 'success');
            
            // Check permissions policy
            try {
                if (document.featurePolicy && document.featurePolicy.allowsFeature) {
                    const usbAllowed = document.featurePolicy.allowsFeature('usb');
                    log(`Permissions Policy - USB allowed: ${usbAllowed}`);
                    
                    if (!usbAllowed) {
                        showStatus('USB API is supported but blocked by Permissions Policy', 'error');
                        return;
                    }
                }
            } catch (e) {
                log(`Could not check permissions policy: ${e.message}`);
            }
            
            document.getElementById('request-device').disabled = false;
            document.getElementById('list-devices').disabled = false;
        });
        
        document.getElementById('request-device').addEventListener('click', async () => {
            log('Requesting USB device access...');
            
            try {
                const device = await navigator.usb.requestDevice({
                    filters: [
                        // Add common device filters
                        { vendorId: 0x05ba, productId: 0x000a }, // fingerprint scanner
                        { vendorId: 0x1949 }, // Fire
                        { vendorId: 0x2341 }, // Arduino
                        { vendorId: 0x1a86 }, // QinHeng Electronics
                        { vendorId: 0x0403 }, // FTDI
                        { vendorId: 0x10c4 }, // Silicon Labs
                    ]
                });
                
                log(`✅ Device selected: ${device.productName || 'Unknown Device'}`);
                showStatus('USB device successfully selected!', 'success');
                
                if (!connectedDevices.find(d => d.vendorId === device.vendorId && d.productId === device.productId)) {
                    connectedDevices.push(device);
                    updateDeviceList();
                }
                
                // Try to open the device
                try {
                    await device.open();
                    log(`Device opened successfully`);
                    await device.close();
                    log(`Device closed`);
                } catch (openError) {
                    log(`Could not open device: ${openError.message}`);
                }
                
            } catch (error) {
                log(`❌ Failed to request device: ${error.message}`);
                showStatus(`Failed to request device: ${error.message}`, 'error');
                
                if (error.name === 'NotAllowedError') {
                    log('This could be due to Permissions Policy blocking USB access');
                }
            }
        });
        
        document.getElementById('list-devices').addEventListener('click', async () => {
            log('Listing connected USB devices...');
            
            try {
                const devices = await navigator.usb.getDevices();
                log(`Found ${devices.length} connected devices`);
                
                if (devices.length === 0) {
                    showStatus('No USB devices found. Try requesting device access first.', 'info');
                    return;
                }
                
                connectedDevices = devices;
                updateDeviceList();
                showStatus(`Found ${devices.length} USB device(s)`, 'success');
                
            } catch (error) {
                log(`❌ Failed to list devices: ${error.message}`);
                showStatus(`Failed to list devices: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('clear-log').addEventListener('click', () => {
            document.getElementById('log').innerHTML = '';
            document.getElementById('status-container').innerHTML = '';
            document.getElementById('device-container').innerHTML = '';
            connectedDevices = [];
        });
        
        // Handle USB device connection/disconnection events
        if (navigator.usb) {
            navigator.usb.addEventListener('connect', event => {
                log(`USB device connected: ${event.device.productName || 'Unknown Device'}`);
            });
            
            navigator.usb.addEventListener('disconnect', event => {
                log(`USB device disconnected: ${event.device.productName || 'Unknown Device'}`);
                connectedDevices = connectedDevices.filter(d => d !== event.device);
                updateDeviceList();
            });
        }
        
        // Initial setup
        log('Page loaded. Click "Check USB API Support" to begin testing.');
        showStatus('Ready to test USB API. Click "Check USB API Support" to start.', 'info');
    </script>
</body>
</html>
